# ~/.config/herdr/config.toml
# nix-managed via home.nix (symlink to Nix store)
#
# Herdr reads this on server start. To reload without restart:
#   herdr server reload-config
#
# Prefix: ctrl+b (tmux explicitly unbinds C-b on line 117 of .tmux.conf,
# so ctrl+b passes straight through tmux to Herdr with no conflicts).

onboarding = false

# ── Shell ─────────────────────────────────────────────────────────────────────
[terminal]
# login shells on macOS — picks up full PATH (Homebrew, Nix, etc.)
shell_mode = "auto"

# ── Prefix & keybindings ──────────────────────────────────────────────────────
[keys]
prefix = "ctrl+b"

# Pane splits — mirror tmux bindings where possible
split_horizontal = "prefix+minus"    # prefix + -  → split below
split_vertical   = "prefix+|"        # prefix + |  → split right

# Tab navigation — mirror tmux C-h / C-l (but prefixed, since bare C-h/j/k/l
# are claimed by vim-tmux-navigator at the tmux layer and won't reach Herdr)
next_tab     = "prefix+l"
previous_tab = "prefix+h"
new_tab      = "prefix+c"

# Pane focus (vim-style, prefixed)
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# Workspace jumps
switch_workspace = "prefix+shift+1..9"
switch_tab       = "prefix+1..9"

# Zoom
zoom = "prefix+z"

# Help
keybind_help = "prefix+?"

# ── Custom commands ────────────────────────────────────────────────────────────

[[keys.command]]
key         = "prefix+alt+g"
type        = "popup"
command     = "lazygit"
description = "lazygit"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "prefix+alt+l"
type        = "popup"
command     = "lazydocker"
description = "lazydocker"
width       = "90%"
height      = "90%"

# ── Theme: Catppuccin Mocha (matches tmux) ────────────────────────────────────
[theme]
name        = "catppuccin"
auto_switch = true
light_name  = "catppuccin-latte"
dark_name   = "catppuccin"

# ── Status bar ────────────────────────────────────────────────────────────────
[ui]
tab_bar_position      = "bottom"
tab_bar_right_separator = "  "

tab_bar_right = [
  { type = "zoom" },
  # git branch of the active pane's cwd
  { type = "command", command = "git -C \"$HERDR_ACTIVE_PANE_CWD\" branch --show-current 2>/dev/null | sed 's/^/ /'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "hostname" },
  { type = "datetime", format = " %H:%M   %d %b" },
]

# ── Sidebar layout (matches tmux Catppuccin agent rows) ───────────────────────
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]
codex = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["workspace", "tab"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

# ── Notifications ─────────────────────────────────────────────────────────────
[ui.toast]
delivery       = "system"      # macOS native notification
delay_seconds  = 1

[ui.sound]
# Mute Droid (background worker), keep Claude/Codex audible
[ui.sound.agents]
droid = "off"
